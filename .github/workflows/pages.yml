name: Dokumentation auf GitHub Pages veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Der Build benötigt nur Lesezugriff auf den Quellcode. Die beiden zusätzlichen
# Rechte sind auf die offizielle GitHub-Pages-Bereitstellung beschränkt.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: VitePress bauen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: Dokumentation bauen
        run: npm run build

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: .vitepress/dist

  deploy:
    name: GitHub Pages veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages-Artefakt veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
